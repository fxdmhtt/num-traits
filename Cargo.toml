[package]
authors = ["The Rust Project Developers"]
description = "Numeric traits for generic mathematics"
documentation = "https://docs.rs/num-traits"
homepage = "https://github.com/rust-num/num-traits"
keywords = ["mathematics", "numerics"]
categories = ["algorithms", "science", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-num/num-traits"
name = "num-traits"
version = "0.2.19"
readme = "README.md"
build = "build.rs"
exclude = ["/ci/*", "/.github/*"]
edition = "2021"
rust-version = "1.60"

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--generate-link-to-definition"]

[features]
default = ["std"]
# The name is kept, the dependency is not: `Float` itself is gated on
# `any(std, libm)` (src/lib.rs, src/float.rs, src/real.rs, src/pow.rs), and
# consumers reach `f32: RealField` through it. What it now means is "provide
# `Float` without `std`", backed by the target's float intrinsics and its C
# library's mathlib instead of a Rust `libm` crate.
libm = []
std = []

# vestigial features, now always in effect
i128 = []

[build-dependencies]
autocfg = "1"
